spring.application.name=blogs
server.port=${SERVER_PORT:8084}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/offbeat_blogs?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:offbeat}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:offbeatpass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

app.storage.path=uploads/blogs
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB